pipeline_version: 1
name: hybrid-review
description: Default pipeline with provider evidence and fail-open Codex blocking-issues review before final review.
stages:
  - id: research
    agents:
      - role: agent-research
  - id: analysis
    depends_on: [research]
    agents:
      - role: agent-analysis
  - id: clarify
    depends_on: [research]
    agents:
      - role: agent-clarify
  - id: writer
    depends_on: [analysis, clarify]
    agents:
      - role: agent-writer
  - id: spec-review
    depends_on: [writer]
    agents:
      - role: agent-spec-review
  - id: provider-review
    depends_on: [writer]
    provider:
      type: swarm-review
      command: review
      selection: auto
      output: findings
      memory: false
      timeout_seconds: 1800
      max_parallel: 4
    failure_tolerance:
      mode: best-effort
  - id: codex-review
    depends_on: [spec-review]
    agents:
      - role: agent-codex-review
        backend: codex
        model: gpt-5.4
        effort: high
    failure_tolerance:
      mode: best-effort
  - id: review
    depends_on: [spec-review, provider-review, codex-review]
    agents:
      - role: agent-review
  - id: docs
    depends_on: [spec-review, provider-review, codex-review]
    agents:
      - role: agent-docs
