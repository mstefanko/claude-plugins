[project]
name = "swarm-do"
version = "0.0.0"
description = "Beads-backed multi-agent orchestration plugin (internal layout)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "coverage[toml]>=7.4",
]
hypothesis = [
  "hypothesis>=6.100",
]

[tool.setuptools]
package-dir = {"" = "py"}

[tool.setuptools.packages.find]
where = ["py"]
include = ["swarm_do*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["py"]
pythonpath = ["py"]
python_files = ["test_*.py"]
python_classes = ["*Tests", "Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "unit: fast, no I/O beyond tmp_path (default for new tests)",
  "integration: spawns subprocesses or git, still hermetic",
  "tui: requires Textual run_test pilot",
  "shell: bats-driven shell tests (collected by `swarm test shell`, not pytest)",
  "live_provider: hits a real provider; off by default in CI",
  "slow: takes >2s; excluded from `swarm test unit`",
]

[tool.coverage.run]
source = ["py/swarm_do"]
branch = true
omit = [
  "py/swarm_do/**/tests/*",
  "py/swarm_do/**/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
